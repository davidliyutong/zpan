# ZPan production Worker — https://cloud.yutongli.io
#
# Lives on the `deploy` branch of davidliyutong/zpan; derived from upstream saltbo/zpan wrangler.toml.
#
# Differences from upstream:
#   - account_id pinned (the wrangler login can see several accounts)
#   - Custom Domains cloud.yutongli.io + dav.cloud.yutongli.io (WebDAV); workers.dev and preview URLs disabled
#   - BETTER_AUTH_URL pinned to the public origin
#   - own D1 / KV IDs (upstream hardcodes the author's)
#   - telemetry cron "0 */12 * * *" removed; ZPAN_TELEMETRY_ALLOW_IP=false
#   - env.staging removed

name = "zpan"
account_id = "6dcf4c92a4c4d0252663ce501ad5dcf3"
main = "./workers/bootstrap.ts"
compatibility_date = "2026-04-12"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

workers_dev = false
preview_urls = false
# dav.cloud.yutongli.io: dedicated WebDAV hostname. It needs a zone Transform Rule
# (http.host eq "dav.cloud.yutongli.io" -> path concat("/dav", http.request.uri.path)),
# maintained by hand in the dashboard; see docs/webdav-custom-domain.md.
routes = [
  { pattern = "cloud.yutongli.io", custom_domain = true },
  { pattern = "dav.cloud.yutongli.io", custom_domain = true },
]

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api",
  "/api/*",
  "/.well-known/oauth-authorization-server/*",
  "/.well-known/openid-configuration/*",
  "/.well-known/oauth-protected-resource/*",
  "/.well-known/zpan-domain-verification/*",
  "/dav",
  "/dav/*",
  "/ih/*",
  "/r/*",
  "/s/*",
]

[[d1_databases]]
binding = "DB"
database_name = "zpan-db"
database_id = "122c2195-688c-4e56-9c91-f264cd985002"
migrations_dir = "./migrations"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "9e340c65fbee4a42be69ea8a1a5a888a"

[[ratelimits]]
name = "WEBDAV_RATE_LIMITER"
namespace_id = "2801"

[ratelimits.simple]
limit = 3600
period = 60

[vars]
BETTER_AUTH_URL = "https://cloud.yutongli.io"
ZPAN_CLOUD_URL = "https://cloud.zpan.space"
ZPAN_CACHE_MODE = "distributed"
ZPAN_TELEMETRY_ALLOW_IP = "false"

[[send_email]]
name = "EMAIL"

[[queues.producers]]
binding = "ARCHIVE_QUEUE"
queue = "zpan-archive-jobs"

[[queues.consumers]]
queue = "zpan-archive-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

# Avatars / logos. Without this binding ZPan falls back to the ZPan Cloud avatar service.
# No r2.dev public URL: avatars are served by the Worker at /api/avatar-blobs.
[[r2_buckets]]
binding = "PUBLIC_IMAGES"
bucket_name = "zpan-public-images"

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# traffic sync | stats rollup | licensing refresh | quota reset | trash purge
[triggers]
crons = ["*/10 * * * *", "10 * * * *", "0 */6 * * *", "0 0 1 * *", "0 4 * * *"]
